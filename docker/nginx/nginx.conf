# ══════════════════════════════════════════════════════════════════════════════
# Sistema de Permisos de Circulación — Nginx (Producción)
#
# Topología:
#   Internet → Nginx (:80/:443) → backend (:3001)  [red: web]
#   backend  →  postgres / redis / minio            [red: internal]
#
# Prerequisitos:
#   - Certificados SSL en ./ssl/cert.pem y ./ssl/key.pem
#   - El dominio debe apuntar a la IP del servidor antes de arrancar
#   - Para Let's Encrypt: ver sección "Obtener certificado" en README_DEPLOY.md
# ══════════════════════════════════════════════════════════════════════════════

# ── Worker model ──────────────────────────────────────────────────────────────
worker_processes      auto;
worker_rlimit_nofile  65535;
error_log             /var/log/nginx/error.log warn;
pid                   /var/run/nginx.pid;

events {
  worker_connections  1024;
  multi_accept        on;
  use                 epoll;
}

http {
  # ── Tipos MIME ─────────────────────────────────────────────────────────────
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Ocultar versión ────────────────────────────────────────────────────────
  server_tokens off;

  # ── Logging estructurado ───────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;

  # ── Performance ────────────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  types_hash_max_size 2048;

  # ── Gzip ───────────────────────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

  # ── Límites de cuerpo (RN-53: adjuntos hasta 10 MB) ───────────────────────
  client_max_body_size    12m;
  client_body_buffer_size 128k;
  client_header_timeout   15s;
  client_body_timeout     60s;

  # ── Buffering del proxy ────────────────────────────────────────────────────
  proxy_buffering          on;
  proxy_buffers            16 32k;
  proxy_buffer_size        64k;
  proxy_busy_buffers_size  128k;
  proxy_temp_file_write_size 128k;

  # ── Timeouts del proxy ─────────────────────────────────────────────────────
  proxy_connect_timeout    10s;
  proxy_send_timeout       90s;
  proxy_read_timeout       90s;
  send_timeout             90s;

  # ── Upstream — NestJS backend ──────────────────────────────────────────────
  upstream nestjs_backend {
    server backend:3001;
    keepalive 32;
  }

  # ── Rate limiting zones ────────────────────────────────────────────────────
  # Zona general: 100 req/s por IP (complementa ThrottlerGuard de NestJS)
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;
  # Zona estricta para auth: 5 req/s por IP
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

  # ── Redireccion HTTP → HTTPS ───────────────────────────────────────────────
  server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Ruta para Let's Encrypt ACME challenge (renovación automática de certificado)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri =404;
    }

    # Todo lo demás → HTTPS permanente
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS principal ────────────────────────────────────────────────────────
  server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # ── Certificados SSL ─────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # ── Protocolos y cifrados seguros (Mozilla Modern) ──────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── HSTS — 1 año, incluye subdominios ───────────────────────────────────
    # ADVERTENCIA: Solo activar cuando el SSL esté correctamente configurado.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-XSS-Protection          "1; mode=block"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                     always;

    # Content-Security-Policy — ajustar si se agrega CDN externo
    add_header Content-Security-Policy
      "default-src 'self'; \
       script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; \
       style-src 'self' 'unsafe-inline'; \
       img-src 'self' data:; \
       font-src 'self'; \
       connect-src 'self'; \
       frame-src https://www.google.com/recaptcha/; \
       object-src 'none'; \
       base-uri 'self';" always;

    # ── Health check (sin rate limiting) ────────────────────────────────────
    location = /api/v1/health {
      proxy_pass         http://nestjs_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      access_log off;
    }

    # ── Endpoints de autenticación (rate limiting estricto) ──────────────────
    location ~ ^/api/v1/auth/(login|recuperar-contrasena) {
      limit_req zone=api_auth burst=10 nodelay;
      limit_req_status 429;

      proxy_pass         http://nestjs_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $request_id;
    }

    # ── API REST — NestJS (todo) ─────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_general burst=200 nodelay;
      limit_req_status 429;

      proxy_pass         http://nestjs_backend;
      proxy_http_version 1.1;

      # WebSocket upgrade (BullMQ board, futuras features)
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;

      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $request_id;

      # Ocultar headers internos del upstream
      proxy_hide_header  X-Powered-By;
    }

    # ── Swagger UI (solo si NODE_ENV != production en el backend) ────────────
    location /api/docs {
      # En producción el backend no monta Swagger — esta ruta retorna 404 del backend.
      # Para entornos de staging donde Swagger esté activo, limitar acceso por IP:
      # allow 192.168.1.0/24;
      # deny all;

      proxy_pass         http://nestjs_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Archivos estáticos del frontend (cuando esté en producción) ───────────
    # Si el frontend se sirve desde este Nginx (no desde Vercel/CDN):
    # location / {
    #   root /var/www/frontend;
    #   try_files $uri $uri/ /index.html;
    #   expires 1h;
    #   add_header Cache-Control "public, no-transform";
    # }

    # ── Manejo de errores ─────────────────────────────────────────────────────
    error_page 404              /404.json;
    error_page 500 502 503 504  /50x.json;

    location = /404.json {
      internal;
      default_type application/json;
      return 404 '{"success":false,"message":"Recurso no encontrado","code":"NOT_FOUND"}';
    }

    location = /50x.json {
      internal;
      default_type application/json;
      return 500 '{"success":false,"message":"Error interno del servidor","code":"INTERNAL_ERROR"}';
    }
  }
}

# ── Map para soporte de WebSocket upgrade ─────────────────────────────────────
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
