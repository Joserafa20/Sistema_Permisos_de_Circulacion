# ══════════════════════════════════════════════════════════════════════════════
# Sistema de Permisos de Circulación — Docker Compose (Desarrollo)
# Docker Compose Specification — sin atributo version
#
# Uso:
#   cp .env.example .env.docker
#   # Editar .env.docker con valores reales
#   docker compose --env-file .env.docker up --build
#   docker compose --env-file .env.docker down          # conserva datos
#   docker compose --env-file .env.docker down -v       # elimina datos
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: pyp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - picoyplaca-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pyp-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - picoyplaca-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO (Object Storage S3-compatible) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: pyp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - picoyplaca-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO Init — crea buckets en el primer arranque ───────────────────────
  createbuckets:
    image: minio/mc:latest
    container_name: pyp-minio-init
    networks:
      - picoyplaca-network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${MINIO_BUCKET_DOCS}    &&
        mc mb --ignore-existing local/${MINIO_BUCKET_PDFS}    &&
        mc mb --ignore-existing local/${MINIO_BUCKET_REPORTS} &&
        echo 'Buckets verificados/creados correctamente' &&
        exit 0
      "
    restart: on-failure

  # ── Backend NestJS ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: pyp-backend
    restart: unless-stopped
    environment:
      NODE_ENV:     ${NODE_ENV:-development}
      PORT:         "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Base de Datos — nombres de servicio, nunca IPs
      DB_HOST:     postgres
      DB_PORT:     "5432"
      DB_NAME:     ${POSTGRES_DB}
      DB_USER:     ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA:   public
      # Redis
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MinIO
      STORAGE_ENDPOINT:      minio
      STORAGE_PORT:          "9000"
      STORAGE_ACCESS_KEY:    ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY:    ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET_DOCS:   ${MINIO_BUCKET_DOCS}
      STORAGE_BUCKET_PDFS:   ${MINIO_BUCKET_PDFS}
      STORAGE_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS}
      STORAGE_USE_SSL:       "false"
      # JWT
      JWT_SECRET:              ${JWT_SECRET}
      JWT_EXPIRES_IN:          ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET:      ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN:  ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Email
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-noreply@alcaldia.gov.co}
      MAIL_PASS: ${MAIL_PASS:-placeholder}
      MAIL_FROM: ${MAIL_FROM:-"Alcaldía PYP <noreply@alcaldia.gov.co>"}
      # reCAPTCHA
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-disabled}
      RECAPTCHA_MIN_SCORE:  ${RECAPTCHA_MIN_SCORE:-0.5}
      # QR y seguridad
      QR_SECRET_SALT: ${QR_SECRET_SALT}
      PUBLIC_URL:     ${PUBLIC_URL:-http://localhost:3000}
      BCRYPT_ROUNDS:  ${BCRYPT_ROUNDS:-12}
      # Hot reload en Windows/WSL con volúmenes
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../backend/src:/app/src
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - picoyplaca-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Frontend Next.js ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: pyp-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-disabled}
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - picoyplaca-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ── Volúmenes nombrados — los datos sobreviven a `docker compose down` ────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ── Red dedicada — todos los servicios se comunican por nombre de servicio ────
networks:
  picoyplaca-network:
    driver: bridge
